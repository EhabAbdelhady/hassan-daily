name: Daily infographic

on:
  # MAIN TRIGGER: cron-job.org calls this workflow's "dispatch" API at 12:05 Cairo time every day
  # with trigger=scheduled (README: "Daily start: cron-job.org"). GitHub's own scheduler below is
  # only a backup: on this repository it has started runs 6+ hours late or not at all.
  schedule:
    # GitHub cron is UTC and Egypt switches between summer (UTC+3) and winter (UTC+2) time:
    # several triggers at :05/:35, and the gate lets the first one inside the Cairo window run.
    - cron: "5 9 * * *"    # summer 12:05 | winter 11:05 (too early, skipped)
    - cron: "35 9 * * *"   # summer 12:35 | winter 11:35 (too early, skipped)
    - cron: "5 10 * * *"   # summer 13:05 | winter 12:05
    - cron: "35 10 * * *"  # summer 13:35 | winter 12:35
    - cron: "5 11 * * *"   # summer 14:05 (too late, skipped) | winter 13:05
    - cron: "35 11 * * *"  # summer 14:35 (too late, skipped) | winter 13:35
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: everything except uploading and posting"
        type: boolean
        default: true
      trigger:
        description: "manual = run now; scheduled = the daily automatic run (time window, once per day, DRY_RUN variable)"
        type: choice
        options: [manual, scheduled]
        default: manual

permissions:
  contents: write   # commit data/history.json and data/posts.json back
  actions: write    # keep-alive and cancelling stale approval requests

env:
  # The daily automatic run (GitHub schedule or cron-job.org) — not a manual run
  AUTO_RUN: ${{ github.event_name == 'schedule' || inputs.trigger == 'scheduled' }}
  # Automatic runs only start between these Cairo times (24-hour clock, HHMM)
  WINDOW_START_CAIRO: "1200"
  WINDOW_END_CAIRO: "1400"
  # Settings (Repository → Settings → Secrets and variables → Actions → Variables)
  DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.trigger != 'scheduled' && inputs.dry_run && 'true') || vars.DRY_RUN || 'true' }}
  REQUIRE_APPROVAL: ${{ vars.REQUIRE_APPROVAL || 'true' }}
  CUTOFF_HOURS: ${{ vars.CUTOFF_HOURS || '2' }}
  POST_TO_FACEBOOK: ${{ vars.POST_TO_FACEBOOK || 'true' }}
  POST_TO_INSTAGRAM: ${{ vars.POST_TO_INSTAGRAM || 'false' }}
  POST_TO_FACEBOOK_STORY: ${{ vars.POST_TO_FACEBOOK_STORY || 'false' }}
  POST_TO_INSTAGRAM_STORY: ${{ vars.POST_TO_INSTAGRAM_STORY || 'false' }}
  AI_PROVIDER: ${{ vars.AI_PROVIDER || 'gemini' }}
  AI_MODEL: ${{ vars.AI_MODEL }}
  EMAIL_SERVICE: ${{ vars.EMAIL_SERVICE || 'gmail' }}
  # Keys (Repository → Settings → Secrets and variables → Actions → Secrets)
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
  GMAIL_USER: ${{ secrets.GMAIL_USER }}
  GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
  ALERT_RECIPIENT_EMAIL: ${{ secrets.ALERT_RECIPIENT_EMAIL }}
  RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
  RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
  CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
  CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
  CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
  META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
  FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
  INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
  META_APP_ID: ${{ secrets.META_APP_ID }}
  META_APP_SECRET: ${{ secrets.META_APP_SECRET }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: prepare
      cancel-in-progress: false
    outputs:
      ready: ${{ steps.prepare.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Check the Cairo time window and that today's automatic run hasn't happened (automatic runs only)
        id: gate
        run: |
          now=$(TZ=Africa/Cairo date +%H%M)
          today=$(TZ=Africa/Cairo date +%F)
          run=true
          missed=false
          if [ "$AUTO_RUN" = "true" ]; then
            done_today=$([ "$(cat data/last_scheduled_run.txt 2>/dev/null)" = "$today" ] && echo yes || echo no)
            if [ "$done_today" = "yes" ]; then
              echo "Today's automatic run already happened ($today). Skipping."
              run=false
            elif [ "$now" -lt "$WINDOW_START_CAIRO" ]; then
              echo "Cairo time is $now, before $WINDOW_START_CAIRO. Skipping."
              run=false
            elif [ "$now" -ge "$WINDOW_END_CAIRO" ]; then
              echo "Cairo time is $now, after $WINDOW_END_CAIRO and today hasn't run: the start came too late."
              run=false
              [ "$(cat data/last_missed_alert.txt 2>/dev/null)" != "$today" ] && missed=true
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "missed=$missed" >> "$GITHUB_OUTPUT"

      - name: Email that today's run was missed
        if: steps.gate.outputs.missed == 'true'
        run: |
          pip install -q python-dotenv requests
          python -c "
          from src.notify import send_alert
          send_alert('today\'s automatic run did not start in time', [
              'The daily start signal arrived at $(TZ=Africa/Cairo date +%H:%M) Cairo time, after the ' + '$WINDOW_END_CAIRO'[:2] + ':00 cutoff.',
              'Nothing was prepared or posted today.',
              'To post today anyway: GitHub → Actions → Daily infographic → Run workflow (untick Dry run).',
              'If this keeps happening, check the cron-job.org job (README: Daily start: cron-job.org).'])
          "
          TZ=Africa/Cairo date +%F > data/last_missed_alert.txt
          git config user.name "hassan-daily-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/last_missed_alert.txt
          git commit -m "Missed run alert $(TZ=Africa/Cairo date +%F)"
          git pull --rebase && git push

      - name: Mark today's automatic run as started
        if: steps.gate.outputs.run == 'true' && env.AUTO_RUN == 'true'
        run: |
          TZ=Africa/Cairo date +%F > data/last_scheduled_run.txt
          git config user.name "hassan-daily-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/last_scheduled_run.txt
          git commit -m "Scheduled run $(TZ=Africa/Cairo date +%F)"
          git pull --rebase && git push

      - name: Cancel yesterday's unanswered approval requests
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "${{ github.repository }}" --workflow daily.yml --status waiting \
            --json databaseId -q '.[].databaseId' | xargs -r -n1 gh run cancel --repo "${{ github.repository }}" || true

      - uses: actions/setup-python@v7
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.gate.outputs.run == 'true'
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Prepare (fetch, check, write, render, verify, email preview)
        id: prepare
        if: steps.gate.outputs.run == 'true'
        run: python main.py prepare

      - name: Save price history
        if: steps.prepare.outcome == 'success'
        run: |
          git config user.name "hassan-daily-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          git diff --cached --quiet || git commit -m "Price history $(TZ=Africa/Cairo date +%F)"
          git pull --rebase && git push

      - uses: actions/upload-artifact@v7
        if: steps.prepare.outcome == 'success'
        with:
          name: prepared-post
          path: |
            output/bundle.json
            output/daily_infographic.png
            output/daily_story.png
            output/caption.txt
          retention-days: 3

  publish:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # With REQUIRE_APPROVAL=true this waits for a reviewer's approval in the "production" environment
    environment: ${{ vars.REQUIRE_APPROVAL == 'false' && 'no-approval' || 'production' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - uses: actions/download-artifact@v8
        with:
          name: prepared-post
          path: output

      - name: Publish (cutoff check, token check, upload, post)
        run: python main.py publish

      - name: Save posting log
        if: always()
        run: |
          git config user.name "hassan-daily-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posts.json 2>/dev/null || exit 0
          git diff --cached --quiet || git commit -m "Posting log $(TZ=Africa/Cairo date +%F)"
          git pull --rebase && git push

  keepalive:
    # GitHub pauses scheduled workflows after 60 days without repository activity.
    # Re-enabling the workflow through the API resets that timer.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily.yml/enable"
